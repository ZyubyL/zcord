name: Run tests

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            relevant:
              - "tests/**"
              - "zcord/**"
              - ".github/workflows/test.yml"
              - "pyproject.toml"

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: |
          uv sync --extra speed --dev
          uv run ruff check zcord
          uv run ty check zcord

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up uv and python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with Python ${{ matrix.python-version }} (${{ matrix.os }})
        run: |
          uv sync --group dev
          uv run --frozen pytest

  ci:
    if: always()
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            exit 1
          fi

          # Skipped lint/test means no relevant changes, fall through
          if [[ "$LINT" != "success" && "$LINT" != "skipped" ]]; then
            exit 1
          fi

          if [[ "$TEST" != "success" && "$TEST" != "skipped" ]]; then
            exit 1
          fi
