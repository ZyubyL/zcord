site_name: Zcord
site_description: A thin Discord API wrapper written in Python
site_url: https://zcord.readthedocs.io/

repo_name: thqnhz/zcord
repo_url: https://github.com/thqnhz/zcord
copyright: Copyright &copy; 2026 ZyubyL

theme:
  font:
    text: Inter
    code: Jetbrains Mono
  name: materialx
  palette:
    scheme: slate
  locale: en
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - navigation.expand
    - navigation.path
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.integrate
    - content.footnote.tooltips
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  logo: assets/zcord_original.png
  favicon: assets/zcord_original.png

extra:
  homepage: https://zcord.readthedocs.io

plugins:
  - privacy
  - autorefs:
      strip_title_tags: false
  - document-dates:
      position: top
      type: date
      show_author: false
  - search:
      enabled: true
  - mkdocstrings:
      custom_templates: docs/templates
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            show_source: false
            show_signature_annotations: true
            show_root_heading: false
            show_bases: false
            show_root_members_full_path: false
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_toc_entry: false
            show_labels: false
            modernize_annotations: true
            line_length: 80
            separate_signature: true
            signature_crossrefs: true
            annotations_path: source
            members_order: source
            docstring_style: google

markdown_extensions:
  - toc:
      toc_depth: 2
      permalink: true
  - abbr
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - API Reference:
    - zcord: api/zcord.md
    - enums: api/enums.md
    - bitfields: api/bitfields.md
    - errors: api/errors.md
  - Class Diagram: class_diagram.md
